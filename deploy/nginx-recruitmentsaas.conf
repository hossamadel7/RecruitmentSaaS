# nginx site for RecruitmentSaaS. Replace DOMAIN with the real domain, then:
#   sudo cp nginx-recruitmentsaas.conf /etc/nginx/sites-available/recruitmentsaas
#   sudo ln -s /etc/nginx/sites-available/recruitmentsaas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN -d www.DOMAIN          # adds HTTPS + http->https redirect
# Upgrade header for WebSockets, plain keep-alive otherwise (named uniquely so it never clashes with other sites).
map $http_upgrade $recruitmentsaas_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name DOMAIN www.DOMAIN;

    # Azure App Service accepted request bodies up to ~28.6 MB; keep at least that.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # WebSockets for the SignalR inbox hub (/hubs/inbox)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $recruitmentsaas_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
